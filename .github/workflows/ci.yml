name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'console/**'
      - '.github/workflows/ci.yml'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '*.slnx'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'console/**'
      - '.github/workflows/ci.yml'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '*.slnx'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest]
        dotnet-version: ['10.0.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal --filter "Category!=Integration&Category!=Functional&Category!=LocalOnly" --blame-hang --blame-hang-timeout 5m
        if: hashFiles('tests/**/*.csproj') != ''

