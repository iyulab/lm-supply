name: CI

on:
  # publish.yml runs after a successful CI run, so every change that can affect a build or a package must start one.
  # This lists what cannot; an allow-list of build inputs missed each new folder or root file (samples/, benchmark/,
  # tools/, global.json, nuget.config) until someone remembered it.
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'images/**'
      - 'LICENSE*'
      - '.gitignore'
      - '.gitattributes'
      - '.public-text-allow'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'images/**'
      - 'LICENSE*'
      - '.gitignore'
      - '.gitattributes'
      - '.public-text-allow'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest]
        dotnet-version: ['10.0.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        if: hashFiles('tests/**/*.csproj') != ''
        # One definition of "the tests pass", shared by this workflow, publish.yml and a local run.
        # The twenty lines of shell that used to live here (in both workflows, drifting separately)
        # ran the whole solution in one invocation and read a single aggregate summary, because MTP
        # exits non-zero when a filter matches zero tests in one assembly of a solution-wide run
        # where VSTest exited 0 (xunit/xunit#3077). An aggregate cannot see one assembly disappear:
        # the other seventeen keep the totals healthy. The script runs project by project, names the
        # projects that legitimately contribute nothing, and fails on every other zero.
        run: pwsh ./scripts/test.ps1 -Verbosity normal -Configuration Release -NoBuild
