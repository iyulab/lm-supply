name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'console/**'
      - '.github/workflows/ci.yml'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '*.slnx'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'console/**'
      - '.github/workflows/ci.yml'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '*.slnx'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest]
        dotnet-version: ['10.0.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        if: hashFiles('tests/**/*.csproj') != ''
        # MTP exits non-zero (observed: 8) when a filter matches zero tests in one assembly of a
        # solution-wide run, where VSTest exited 0 (xunit/xunit#3077, confirmed in this ecosystem's
        # rollout via FluxIndex's Cache.Redis.Tests/Storage.Neo4j.Tests, cycle-371).
        # LMSupply.Integration.Tests is entirely Category=Integration/Functional/LocalOnly, so it
        # always filters to zero here — treat that as success by checking the aggregate "failed:"
        # count rather than trusting dotnet test's own exit code for this specific shape
        # (BD-20260829-xunit-v3-pilot, cycle-372).
        run: |
          set +e
          output=$(dotnet test --configuration Release --no-build --verbosity normal --filter-not-trait "Category=Integration" --filter-not-trait "Category=Functional" --filter-not-trait "Category=LocalOnly" --hangdump --hangdump-timeout 5m 2>&1)
          code=$?
          echo "$output"
          if [ "$code" -eq 0 ]; then exit 0; fi
          failed=$(echo "$output" | grep -oP '(?<=^\s{2}failed:\s)\d+' | tail -1)
          succeeded=$(echo "$output" | grep -oP '(?<=^\s{2}succeeded:\s)\d+' | tail -1)
          # A zero failed count is NOT on its own evidence that the quirk is what happened: a run
          # where every project filtered to nothing also reports "failed: 0", and translating that
          # to success is how a suite that vanished - a deleted file, an over-applied trait, a
          # mistyped filter - reports green. Requiring a non-zero pass count is what separates
          # "one known assembly matched nothing" from "nothing ran at all".
          if [ -n "$failed" ] && [ "$failed" -eq 0 ] && [ -n "$succeeded" ] && [ "$succeeded" -gt 0 ]; then
            echo "::notice::dotnet test exited $code with $succeeded passed and 0 failed -- MTP's zero-tests-matched-a-filter quirk, not a real failure."
            exit 0
          fi
          if [ -n "$succeeded" ] && [ "$succeeded" -eq 0 ]; then
            echo "::error::dotnet test exited $code and NO tests ran. This is not the zero-tests-matched-a-filter quirk; the suite itself contributed nothing."
          fi
          exit $code

