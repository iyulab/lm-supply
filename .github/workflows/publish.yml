name: Publish to NuGet

on:
  # Trigger after CI workflow completes successfully
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 'Force publish even if version exists on NuGet'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only run if CI succeeded (or manual trigger)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from Directory.Build.props
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Check if version already published
        id: check
        run: |
          if [ "${{ inputs.force }}" == "true" ]; then
            echo "SKIP=false" >> $GITHUB_OUTPUT
            echo "Force publish enabled, skipping version check"
          else
            # Ask the flat container for the exact nupkg: 200 means this version is already published.
            # (`dotnet nuget search` is not a command in the current SDK; its failure was swallowed by
            # `|| true` and read as "not found", so this check never skipped.)
            VERSION="${{ steps.version.outputs.VERSION }}"
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://api.nuget.org/v3-flatcontainer/lmsupply.core/${VERSION}/lmsupply.core.${VERSION}.nupkg")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "SKIP=true" >> $GITHUB_OUTPUT
              echo "Version ${{ steps.version.outputs.VERSION }} already exists on NuGet"
            else
              echo "SKIP=false" >> $GITHUB_OUTPUT
              echo "Version ${{ steps.version.outputs.VERSION }} is new (HTTP $HTTP_STATUS), will publish"
            fi
          fi

      - name: Restore dependencies
        if: steps.check.outputs.SKIP != 'true'
        run: dotnet restore

      - name: Build
        if: steps.check.outputs.SKIP != 'true'
        run: dotnet build --configuration Release --no-restore

      - name: Test
        if: steps.check.outputs.SKIP != 'true' && hashFiles('tests/**/*.csproj') != ''
        # Same script as ci.yml, deliberately: one definition of what "the tests pass" means, used
        # by both workflows and by a local run. See that file's Test step for why this is not a
        # plain solution-wide `dotnet test`.
        run: pwsh ./scripts/test.ps1 -Verbosity normal -Configuration Release -NoBuild

      - name: Pack
        if: steps.check.outputs.SKIP != 'true'
        run: dotnet pack --configuration Release --output ./artifacts --no-build

      - name: Push to NuGet
        if: steps.check.outputs.SKIP != 'true'
        run: |
          for package in ./artifacts/*.nupkg; do
            # Skip symbol packages (snupkg) - symbols are embedded in DLLs
            if [[ "$package" == *.snupkg ]]; then
              echo "Skipping symbol package: $package"
              continue
            fi
            echo "Publishing $package"
            dotnet nuget push "$package" \
              --api-key ${{ secrets.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate \
              --no-symbols
          done

      - name: Create Git Tag
        if: steps.check.outputs.SKIP != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG_NAME="v${{ steps.version.outputs.VERSION }}"
          # Check if tag already exists
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG_NAME}$"; then
            echo "Tag ${TAG_NAME} already exists, skipping tag creation"
          else
            git tag -a "${TAG_NAME}" -m "Release ${TAG_NAME}"
            git push origin "${TAG_NAME}"
          fi

      - name: Check if Release exists
        if: steps.check.outputs.SKIP != 'true'
        id: release_check
        run: |
          TAG_NAME="v${{ steps.version.outputs.VERSION }}"
          if gh release view "${TAG_NAME}" &>/dev/null; then
            echo "RELEASE_EXISTS=true" >> $GITHUB_OUTPUT
            echo "Release ${TAG_NAME} already exists"
          else
            echo "RELEASE_EXISTS=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: steps.check.outputs.SKIP != 'true' && steps.release_check.outputs.RELEASE_EXISTS != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      skip: ${{ steps.check.outputs.SKIP }}

  # Build Console Host for multiple platforms
  build-console:
    needs: publish
    if: needs.publish.outputs.skip != 'true'
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: lm-supply-win-x64.zip
          - os: ubuntu-latest
            rid: linux-x64
            artifact: lm-supply-linux-x64.tar.gz
          - os: macos-latest
            rid: osx-x64
            artifact: lm-supply-osx-x64.tar.gz
          - os: macos-latest
            rid: osx-arm64
            artifact: lm-supply-osx-arm64.tar.gz

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'console/ui/package-lock.json'

      - name: Build UI
        run: |
          cd console/ui
          npm ci
          npm run build

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish Console Host
        shell: bash
        run: |
          dotnet publish console/host/LMSupply.Console.Host.csproj \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:PublishReadyToRun=true \
            -p:EnableCompressionInSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=embedded \
            --output ./publish/${{ matrix.rid }}

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path ./publish/${{ matrix.rid }}/* -DestinationPath ./publish/${{ matrix.artifact }}

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd ./publish/${{ matrix.rid }}
          tar -czvf ../${{ matrix.artifact }} *

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.publish.outputs.version }}
          files: ./publish/${{ matrix.artifact }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
